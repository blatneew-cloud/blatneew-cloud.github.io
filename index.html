<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clarkson Goalie Analytics</title>
  <meta name="description" content="Clarkson goaltending performance dashboard">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>

:root{
  --green:#0c3b2a;
  --green-2:#174d39;
  --green-3:#dfece6;
  --gold:#c7a84a;
  --ink:#17211c;
  --muted:#66726c;
  --line:#dfe4e1;
  --panel:#ffffff;
  --bg:#f4f6f5;
  --good:#16724b;
  --bad:#b3413e;
  --warn:#9a7119;
  --shadow:0 10px 26px rgba(12,59,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--bg);
}
button,select,input{font:inherit}
.app-shell{max-width:1460px;margin:0 auto;min-height:100vh}
.site-header{
  display:flex;justify-content:space-between;gap:24px;align-items:center;
  padding:22px 28px;background:var(--green);color:#fff;border-bottom:3px solid var(--gold);
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{
  width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--green);
  display:grid;place-items:center;font-weight:900;letter-spacing:-1px
}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em;opacity:.8;font-weight:700}
h1{margin:2px 0 0;font-size:1.55rem;line-height:1.1}
.header-controls{display:flex;gap:10px;flex-wrap:wrap}
.header-controls label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.95}
select,input{
  margin-top:5px;border:1px solid rgba(255,255,255,.28);background:#fff;color:var(--ink);
  border-radius:8px;padding:9px 34px 9px 10px;min-width:155px
}
.main-nav{
  display:flex;gap:8px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;overflow:auto
}
.main-nav a{
  color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:700;
  white-space:nowrap;font-size:.92rem
}
.main-nav a.active,.main-nav a:hover{color:var(--green);background:var(--green-3)}
main{padding:24px 28px 44px}
.page-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}
.page-head h2{margin:0;font-size:1.5rem}
.page-head p{margin:5px 0 0;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;
  cursor:pointer;font-weight:700
}
.btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.metric-grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:16px 0 22px
}
.metric-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--shadow);min-width:0
}
.metric-label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.metric-value{font-size:1.75rem;font-weight:850;margin:4px 0 2px;letter-spacing:-.035em}
.metric-sub{color:var(--muted);font-size:.82rem;line-height:1.35}
.metric-value.good{color:var(--good)} .metric-value.bad{color:var(--bad)}
.section-title{font-size:1rem;margin:0 0 12px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;
  box-shadow:var(--shadow);min-width:0
}
.chart-wrap{height:280px;position:relative}
.chart-wrap.tall{height:320px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
th,td{padding:10px 11px;text-align:right;border-bottom:1px solid #edf0ee;white-space:nowrap}
th{background:#f7f8f7;color:var(--muted);font-size:.73rem;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#f7faf8}
.result{font-weight:800}
.result.W{color:var(--good)} .result.L,.result.OTL{color:var(--bad)}
.tag{
  display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:var(--green-3);
  color:var(--green);font-weight:800;font-size:.72rem
}
.note{
  margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);background:#fbf8ed;color:#5e5539;border-radius:6px
}
.split-table{width:100%}
.split-table td:first-child{font-weight:750}
.tracking-row{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0ee}
.tracking-row:last-child{border-bottom:0}
.tracking-main{font-weight:800}
.tracking-rate{font-size:1.35rem;font-weight:850;text-align:right}
.tracking-detail{text-align:right;color:var(--muted);font-size:.84rem}
.empty-state{
  text-align:center;padding:54px 20px;background:#fff;border:1px dashed #ccd5d0;border-radius:12px;color:var(--muted)
}
.coming{
  max-width:780px;margin:28px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;
  box-shadow:var(--shadow)
}
.coming h3{margin-top:0}
.callout{padding:13px 15px;border-radius:10px;background:var(--green-3);color:var(--green);font-weight:700}
.game-detail{display:none;background:#fbfcfb}
.game-detail.open{display:table-row}
.game-detail td{white-space:normal;text-align:left!important;padding:14px}
.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.detail-box{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
.detail-box strong{display:block;margin-bottom:4px}
.legend-line{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin:4px 0 10px}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px}
footer{padding:24px 28px 35px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.small{font-size:.82rem;color:var(--muted)}
.kicker{color:var(--green);font-weight:850;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em}
.stat-positive{color:var(--good);font-weight:800}
.stat-negative{color:var(--bad);font-weight:800}

.live-status{align-self:end;margin-bottom:1px;padding:8px 10px;border-radius:999px;font-size:.74rem;font-weight:850;letter-spacing:.03em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;white-space:nowrap}
.live-status.ok{background:#e6f4ec;color:#12613f;border-color:#b9dfc9}
.live-status.fallback{background:#fff4d8;color:#7a5c12;border-color:#ead693}

@media(max-width:1050px){
  .metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-3{grid-template-columns:1fr}
}
@media(max-width:760px){
  .site-header{align-items:flex-start;flex-direction:column;padding:18px}
  .header-controls{width:100%}
  .header-controls label{flex:1;min-width:130px}
  .header-controls select{width:100%;min-width:0}
  main{padding:18px 14px 34px}
  .main-nav{padding:8px 10px}
  .page-head{align-items:flex-start;flex-direction:column}
  .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:430px){
  .metric-grid{grid-template-columns:1fr 1fr}
  .metric-value{font-size:1.45rem}
  .panel{padding:13px}
  .chart-wrap{height:245px}
}

</style>

  <script>
const LIVE_SHEET = {
  spreadsheetId: "1027gJD_afI4HIJpS7tEDEwN_lcgyMPrc7T0e6-G-dS4",
  sheetName: "Games"
};

function normalizeDate(v, f){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const txt = String(f ?? v ?? "").trim();
  let m = txt.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (m) return `${m[1]}-${String(Number(m[2])+1).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  const d = new Date(txt);
  if (!isNaN(d)) {
    const y=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0");
    return `${y}-${mo}-${da}`;
  }
  return txt;
}

function gvizToSiteData(resp){
  if (!resp || !resp.table || !Array.isArray(resp.table.cols)) throw new Error("No sheet table returned");
  const labels = resp.table.cols.map(c => c.label || c.id || "");
  const idx = Object.fromEntries(labels.map((x,i)=>[x,i]));
  const cell=(row,label,formatted=false)=>{
    const i=idx[label];
    if(i===undefined) return null;
    const c=row.c?.[i];
    if(!c) return null;
    return formatted && c.f!=null ? c.f : c.v;
  };
  const num=x=> (x===null || x==="" || x===undefined) ? 0 : Number(x);
  const bool=x=> String(x??"").toLowerCase()==="yes" || x===true;
  const games=[];
  for(const row of resp.table.rows || []){
    const goalie=cell(row,"Goalie",true) ?? cell(row,"Goalie");
    const season=cell(row,"Season",true) ?? cell(row,"Season");
    const opponent=cell(row,"Opponent",true) ?? cell(row,"Opponent");
    if(!goalie || !season || !opponent) continue;
    const dateRaw=cell(row,"Date");
    const dateFmt=cell(row,"Date",true);
    const toi = cell(row,"TOI",true) ?? cell(row,"TOI") ?? "";
    const rankRaw = cell(row,"Opp Off Rank",true) ?? cell(row,"Opp Off Rank");
    games.push({
      game:num(cell(row,"Game #")) || games.length+1,
      goalie:String(goalie),
      date:normalizeDate(dateRaw,dateFmt),
      season:String(season),
      opponent:String(opponent),
      oppOffRank:(rankRaw===null || rankRaw==="") ? null : rankRaw,
      location:String(cell(row,"H/A",true) ?? cell(row,"H/A") ?? ""),
      result:String(cell(row,"Result",true) ?? cell(row,"Result") ?? ""),
      teamGF:num(cell(row,"Team GF")),
      oppGF:num(cell(row,"Opp Final GF")),
      toi:String(toi),
      started:bool(cell(row,"Started?",true) ?? cell(row,"Started?")),
      pulled:bool(cell(row,"Pulled?",true) ?? cell(row,"Pulled?")),
      ot:bool(cell(row,"OT?",true) ?? cell(row,"OT?")),
      so:bool(cell(row,"SO?",true) ?? cell(row,"SO?")),
      b2b:bool(cell(row,"B2B?",true) ?? cell(row,"B2B?")),
      xGA:num(cell(row,"xGA")),
      gradesSA:{"A+":num(cell(row,"A+ SA")),"A":num(cell(row,"A SA")),"B":num(cell(row,"B SA")),"C":num(cell(row,"C SA"))},
      gradesGA:{"A+":num(cell(row,"A+ GA")),"A":num(cell(row,"A GA")),"B":num(cell(row,"B GA")),"C":num(cell(row,"C GA"))},
      rebound:{green:num(cell(row,"Reb G")),red:num(cell(row,"Reb R")),black:num(cell(row,"Reb B"))},
      glove:{green:num(cell(row,"Glv G")),red:num(cell(row,"Glv R")),black:num(cell(row,"Glv B"))},
      playmaking:{green:num(cell(row,"PM G")),red:num(cell(row,"PM R")),black:num(cell(row,"PM B"))},
      pipes:cell(row,"Pipes"),
      note:String(cell(row,"Notes",true) ?? cell(row,"Notes") ?? "")
    });
  }
  if(!games.length) throw new Error("No completed game rows found");
  const roster=[...new Set(["#30 Soderwall","#70 Gaudreau","#35 Labre",...games.map(g=>g.goalie)])];
  return {team:"Clarkson", roster, games, live:true};
}

function loadLiveGoalieData(){
  return new Promise(resolve=>{
    const cb="__clarksonGoalieSheetCallback";
    const timeout=setTimeout(()=>{
      delete window[cb];
      resolve({...window.GOALIE_SITE_DATA,live:false});
    },5000);
    window[cb]=(resp)=>{
      clearTimeout(timeout);
      delete window[cb];
      try{ resolve(gvizToSiteData(resp)); }
      catch(e){ console.warn("Using embedded fallback data:",e); resolve({...window.GOALIE_SITE_DATA,live:false}); }
    };
    const script=document.createElement("script");
    const params=new URLSearchParams({sheet:LIVE_SHEET.sheetName,tqx:`responseHandler:${cb}`});
    script.src=`https://docs.google.com/spreadsheets/d/${LIVE_SHEET.spreadsheetId}/gviz/tq?${params}`;
    script.onerror=()=>{ clearTimeout(timeout); delete window[cb]; resolve({...window.GOALIE_SITE_DATA,live:false}); };
    document.head.appendChild(script);
  });
}

function startGoalieApp(DATA){
  const state = {
    goalie: DATA.roster[0],
    season: "2025-26",
    route: location.hash.replace("#","") || "overview",
    detailMode: false,
    windowSize: 5,
    charts: []
  };

  const el = id => document.getElementById(id);
  const app = el("app");

  function parseTOI(s){
    if(!s) return 0;
    const [m,sec] = s.split(":").map(Number);
    return m + sec/60;
  }
  function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0),0); }
  function pct(v, digits=3){ return Number.isFinite(v) ? v.toFixed(digits).replace(/^0/,"") : "—"; }
  function fixed(v,d=2){ return Number.isFinite(v) ? v.toFixed(d) : "—"; }
  function signed(v,d=2){
    if(!Number.isFinite(v)) return "—";
    return `${v>0?"+":""}${v.toFixed(d)}`;
  }
  function dateLabel(iso, year=false){
    const d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString("en-US", year ? {month:"short",day:"numeric",year:"numeric"} : {month:"short",day:"numeric"});
  }
  function gradeSum(obj){ return sum(Object.values(obj || {})); }
  function rateGRB(obj){
    const total=(obj?.green||0)+(obj?.red||0)+(obj?.black||0);
    return total ? ((obj.green||0)+(obj.black||0))/total : null;
  }
  function gameMetrics(g){
    const sog = gradeSum(g.gradesSA);
    const ga = gradeSum(g.gradesGA);
    const sv = Math.max(0,sog-ga);
    const toiMin=parseTOI(g.toi);
    const svp=sog?sv/sog:null;
    const xsvp=sog?1-g.xGA/sog:null;
    const gsax=g.xGA-ga;
    const gaa=toiMin?ga*60/toiMin:null;
    return {...g,sog,ga,sv,toiMin,svp,xsvp,gsax,gaa};
  }
  function filteredGames(){
    return DATA.games.map(gameMetrics).filter(g => g.goalie===state.goalie && g.season===state.season);
  }
  function aggregate(games){
    const gp=games.length;
    const wins=games.filter(g=>g.result==="W").length;
    const losses=games.filter(g=>g.result==="L").length;
    const otl=games.filter(g=>g.result==="OTL").length;
    const sog=sum(games.map(g=>g.sog));
    const ga=sum(games.map(g=>g.ga));
    const sv=sum(games.map(g=>g.sv));
    const toi=sum(games.map(g=>g.toiMin));
    const xGA=sum(games.map(g=>g.xGA));
    const rebound = {
      green:sum(games.map(g=>g.rebound?.green)),
      red:sum(games.map(g=>g.rebound?.red)),
      black:sum(games.map(g=>g.rebound?.black))
    };
    const glove = {
      green:sum(games.map(g=>g.glove?.green)),
      red:sum(games.map(g=>g.glove?.red)),
      black:sum(games.map(g=>g.glove?.black))
    };
    const playmaking = {
      green:sum(games.map(g=>g.playmaking?.green)),
      red:sum(games.map(g=>g.playmaking?.red)),
      black:sum(games.map(g=>g.playmaking?.black))
    };
    const gradesSA = {"A+":0,"A":0,"B":0,"C":0};
    const gradesGA = {"A+":0,"A":0,"B":0,"C":0};
    games.forEach(g=>{
      Object.keys(gradesSA).forEach(k=>{
        gradesSA[k]+=g.gradesSA?.[k]||0;
        gradesGA[k]+=g.gradesGA?.[k]||0;
      });
    });
    return {
      gp,wins,losses,otl,record:`${wins}-${losses}${otl?`-${otl}`:""}`,winPct:gp?wins/gp:null,
      sog,ga,sv,toi,xGA,
      svp:sog?sv/sog:null,
      xsvp:sog?1-xGA/sog:null,
      gsax:xGA-ga,
      gaa:toi?ga*60/toi:null,
      xgaa:toi?xGA*60/toi:null,
      shutouts:games.filter(g=>g.ga===0).length,
      avgSog60:toi?sog*60/toi:null,
      rebound,glove,playmaking,gradesSA,gradesGA,
      reboundRate:rateGRB(rebound),gloveSaveRate:rateGRB(glove),gloveFreezeRate:(glove.green+glove.red+glove.black)?glove.black/(glove.green+glove.red+glove.black):null,
      pmRate:rateGRB(playmaking),pmPer60:toi?(playmaking.green+playmaking.red+playmaking.black)*60/toi:null
    };
  }
  function destroyCharts(){ state.charts.forEach(c=>{ try{c.destroy()}catch(e){} }); state.charts=[]; }
  function colors(){
    const s=getComputedStyle(document.documentElement);
    return {
      green:s.getPropertyValue("--green").trim(),
      gold:s.getPropertyValue("--gold").trim(),
      good:s.getPropertyValue("--good").trim(),
      bad:s.getPropertyValue("--bad").trim(),
      muted:s.getPropertyValue("--muted").trim(),
      line:s.getPropertyValue("--line").trim()
    };
  }
  function chart(id, config){
    if(!window.Chart) return;
    const node=el(id); if(!node) return;
    const c = new Chart(node, config); state.charts.push(c);
  }
  function baseOptions(yTitle){
    return {
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8}},tooltip:{mode:"index",intersect:false}},
      interaction:{mode:"nearest",axis:"x",intersect:false},
      scales:{
        x:{grid:{display:false},ticks:{color:colors().muted}},
        y:{grid:{color:"#edf0ee"},ticks:{color:colors().muted},title:{display:!!yTitle,text:yTitle}}
      }
    };
  }

  function metric(label,value,sub="",cls=""){
    return `<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value ${cls}">${value}</div><div class="metric-sub">${sub}</div></div>`;
  }

  function setSelectors(){
    const goalieSel=el("goalieSelect");
    goalieSel.innerHTML=DATA.roster.map(g=>`<option ${g===state.goalie?"selected":""}>${g}</option>`).join("");
    const seasons=[...new Set(DATA.games.map(g=>g.season))].sort().reverse();
    if(!seasons.includes("2026-27")) seasons.unshift("2026-27");
    const seasonSel=el("seasonSelect");
    seasonSel.innerHTML=seasons.map(s=>`<option ${s===state.season?"selected":""}>${s}</option>`).join("");
    goalieSel.addEventListener("change",()=>{state.goalie=goalieSel.value; render();});
    seasonSel.addEventListener("change",()=>{state.season=seasonSel.value; render();});
  }

  function updateHeader(){
    el("goalieTitle").textContent=state.goalie;
    document.querySelectorAll(".main-nav a").forEach(a=>a.classList.toggle("active",a.dataset.route===state.route));
  }

  function renderOverview(games){
    if(!games.length) return empty(`No ${state.season} games have been logged for ${state.goalie} yet.`);
    const a=aggregate(games);
    const svDelta=(a.svp!=null&&a.xsvp!=null)?a.svp-a.xsvp:null;
    const detailed=state.detailMode;
    app.innerHTML=`
      <div class="page-head">
        <div><div class="kicker">${state.season}</div><h2>Overview</h2><p>${games.length} logged game${games.length===1?"":"s"} · SIG GameDay + box score</p></div>
        <div class="toolbar">
          <button class="btn ${!detailed?"active":""}" id="simpleBtn">Simple</button>
          <button class="btn ${detailed?"active":""}" id="detailBtn">Detailed</button>
        </div>
      </div>
      <div class="metric-grid">
        ${metric("Games Played",a.gp,`${a.record} · ${fixed(a.winPct*100,0)}% win rate`)}
        ${metric("Shots Faced",a.sog,`${fixed(a.avgSog60,1)} avg per 60 · ${a.sv} saves`)}
        ${metric("SV%",pct(a.svp),`xSV% ${pct(a.xsvp)}`)}
        ${metric("GAA",fixed(a.gaa,2),`xGAA ${fixed(a.xgaa,2)}`)}
        ${metric("GSAx",signed(a.gsax,2),`SV% − xSV% ${signed(svDelta,3)}`,a.gsax>=0?"good":"bad")}
        ${metric("Shutouts",a.shutouts,`${games.filter(g=>g.b2b).length} B2B start${games.filter(g=>g.b2b).length===1?"":"s"}`)}
      </div>

      <div class="grid-2">
        <section class="panel"><h3 class="section-title">SV% vs Expected</h3><div class="chart-wrap"><canvas id="svExpectedChart"></canvas></div></section>
        <section class="panel"><h3 class="section-title">SV% Distribution</h3><div class="chart-wrap"><canvas id="svDistChart"></canvas></div></section>
      </div>
      <div class="grid-2">
        <section class="panel"><h3 class="section-title">GA Distribution</h3><div class="chart-wrap"><canvas id="gaDistChart"></canvas></div></section>
        <section class="panel"><h3 class="section-title">Goals by Grade</h3><div class="chart-wrap"><canvas id="goalsGradeChart"></canvas></div></section>
      </div>

      <section class="panel">
        <h3 class="section-title">Recent Games</h3>
        ${recentTable(games)}
      </section>

      <div class="grid-2">
        <section class="panel"><h3 class="section-title">Situational Splits</h3>${splitTables(games)}</section>
        <section class="panel"><h3 class="section-title">Actual vs Expected</h3>${actualExpected(a)}</section>
      </div>

      ${detailed ? `
      <div class="grid-3">
        <section class="panel"><h3 class="section-title">Rebound Control</h3>${trackingBlock("Control Rate",a.reboundRate,a.rebound,"Per save",a.sv?(a.rebound.green+a.rebound.red+a.rebound.black)/a.sv:null)}</section>
        <section class="panel"><h3 class="section-title">Glove Performance</h3>${trackingBlock("Save Rate",a.gloveSaveRate,a.glove,"Freeze rate",a.gloveFreezeRate)}</section>
        <section class="panel"><h3 class="section-title">Playmaking</h3>${trackingBlock("Retention Rate",a.pmRate,a.playmaking,"Per 60",a.pmPer60)}</section>
      </div>`:""}
    `;
    el("simpleBtn").onclick=()=>{state.detailMode=false;renderOverview(games);};
    el("detailBtn").onclick=()=>{state.detailMode=true;renderOverview(games);};

    const c=colors();
    chart("svExpectedChart",{
      type:"line",
      data:{labels:games.map(g=>`G${g.game}`),datasets:[
        {label:"SV%",data:games.map(g=>g.svp),borderColor:c.green,backgroundColor:c.green,tension:.25,pointRadius:4},
        {label:"xSV%",data:games.map(g=>g.xsvp),borderColor:c.gold,backgroundColor:c.gold,tension:.25,pointRadius:4}
      ]},
      options:{...baseOptions("Save percentage"),scales:{...baseOptions().scales,y:{min:.80,max:1,grid:{color:"#edf0ee"},ticks:{callback:v=>Number(v).toFixed(3)}}}}
    });
    const buckets=[["<.880",g=>g.svp<.88],[".880–.899",g=>g.svp>=.88&&g.svp<.90],[".900–.919",g=>g.svp>=.90&&g.svp<.92],[".920–.949",g=>g.svp>=.92&&g.svp<.95],[".950+",g=>g.svp>=.95]];
    chart("svDistChart",{type:"bar",data:{labels:buckets.map(b=>b[0]),datasets:[{label:"Games",data:buckets.map(b=>games.filter(b[1]).length),backgroundColor:c.green}]},options:baseOptions("Games")});
    const maxGA=Math.max(...games.map(g=>g.ga),5);
    chart("gaDistChart",{type:"bar",data:{labels:Array.from({length:maxGA+1},(_,i)=>String(i)),datasets:[{label:"Games",data:Array.from({length:maxGA+1},(_,i)=>games.filter(g=>g.ga===i).length),backgroundColor:c.gold}]},options:baseOptions("Games")});
    chart("goalsGradeChart",{type:"bar",data:{labels:["A+","A","B","C"],datasets:[{label:"Goals Against",data:["A+","A","B","C"].map(k=>a.gradesGA[k]),backgroundColor:c.green}]},options:baseOptions("Goals")});
  }

  function recentTable(games){
    return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Opp</th><th>Res</th><th>Score</th><th>SV%</th><th>GA</th><th>GSAx</th></tr></thead><tbody>${
      [...games].reverse().map(g=>`<tr><td>${dateLabel(g.date)}</td><td>${g.opponent}</td><td><span class="result ${g.result}">${g.result}</span></td><td>${g.teamGF}-${g.oppGF}</td><td>${pct(g.svp)}</td><td>${g.ga}</td><td class="${g.gsax>=0?"stat-positive":"stat-negative"}">${signed(g.gsax,2)}</td></tr>`).join("")
    }</tbody></table></div>`;
  }

  function splitTables(games){
    const splits=[
      ["Home",games.filter(g=>g.location==="H")],
      ["Away",games.filter(g=>g.location==="A")],
      ["B2B",games.filter(g=>g.b2b)],
      ["Rest",games.filter(g=>!g.b2b)]
    ];
    return `<table class="split-table"><thead><tr><th></th><th>GP</th><th>Record</th><th>SV%</th><th>GAA</th><th>GSAx</th></tr></thead><tbody>${
      splits.map(([name,gs])=>{const a=aggregate(gs);return `<tr><td>${name}</td><td>${a.gp}</td><td>${a.gp?a.record:"—"}</td><td>${a.gp?pct(a.svp):"—"}</td><td>${a.gp?fixed(a.gaa,2):"—"}</td><td>${a.gp?signed(a.gsax,2):"—"}</td></tr>`}).join("")
    }</tbody></table>`;
  }

  function actualExpected(a){
    const deltaSV=(a.svp!=null&&a.xsvp!=null)?a.svp-a.xsvp:null;
    return `<table><thead><tr><th></th><th>Actual</th><th>Expected</th><th>Delta</th></tr></thead><tbody>
      <tr><td>SV%</td><td>${pct(a.svp)}</td><td>${pct(a.xsvp)}</td><td>${signed(deltaSV,3)}</td></tr>
      <tr><td>GAA</td><td>${fixed(a.gaa,2)}</td><td>${fixed(a.xgaa,2)}</td><td>${signed(a.xgaa-a.gaa,2)}</td></tr>
      <tr><td>GA</td><td>${a.ga}</td><td>${fixed(a.xGA,2)}</td><td>${signed(a.xGA-a.ga,2)}</td></tr>
    </tbody></table>`;
  }

  function trackingBlock(label,rate,obj,extraLabel,extraValue){
    const total=(obj?.green||0)+(obj?.red||0)+(obj?.black||0);
    const extra = extraLabel.toLowerCase().includes("rate") ? (Number.isFinite(extraValue)?fixed(extraValue*100,1)+"%":"—") : (Number.isFinite(extraValue)?fixed(extraValue,2):"—");
    return `
      <div class="tracking-row"><div class="tracking-main">${label}</div><div></div><div class="tracking-rate">${rate==null?"—":fixed(rate*100,1)+"%"}</div></div>
      <div class="tracking-row"><div class="tracking-main">Green / Red / Black</div><div></div><div class="tracking-detail">${obj.green||0} / ${obj.red||0} / ${obj.black||0}</div></div>
      <div class="tracking-row"><div class="tracking-main">${extraLabel}</div><div></div><div class="tracking-detail">${extra}</div></div>
      <div class="small" style="margin-top:10px">${total} tracked event${total===1?"":"s"}</div>`;
  }

  function renderGames(games){
    if(!games.length) return empty(`No ${state.season} games have been logged for ${state.goalie} yet.`);
    app.innerHTML=`
      <div class="page-head"><div><div class="kicker">${state.season}</div><h2>Game Log</h2><p>Click a game to expand SIG detail and notes.</p></div></div>
      <section class="panel">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Date</th><th>Opponent</th><th>Rank</th><th>H/A</th><th>Res</th><th>Score</th><th>TOI</th><th>SOG</th><th>SV</th><th>SV%</th><th>xSV%</th><th>GSAx</th><th>GAA</th><th>xGA</th></tr></thead>
        <tbody>
        ${games.map(g=>`
          <tr class="clickable" data-game="${g.game}">
            <td>${g.game}</td><td>${dateLabel(g.date,true)}</td><td>${g.opponent}</td><td>${g.oppOffRank??"—"}</td><td>${g.location}</td>
            <td><span class="result ${g.result}">${g.result}</span></td><td>${g.teamGF}-${g.oppGF}</td><td>${g.toi}</td><td>${g.sog}</td><td>${g.sv}</td>
            <td>${pct(g.svp)}</td><td>${pct(g.xsvp)}</td><td class="${g.gsax>=0?"stat-positive":"stat-negative"}">${signed(g.gsax,2)}</td><td>${fixed(g.gaa,2)}</td><td>${fixed(g.xGA,2)}</td>
          </tr>
          <tr class="game-detail" id="detail-${g.game}"><td colspan="15">${gameDetail(g)}</td></tr>
        `).join("")}
        </tbody>
      </table></div></section>
    `;
    document.querySelectorAll("tr.clickable").forEach(row=>row.addEventListener("click",()=>el("detail-"+row.dataset.game).classList.toggle("open")));
  }

  function gameDetail(g){
    return `<div class="detail-grid">
      <div class="detail-box"><strong>Shot Grades</strong>A+ ${g.gradesSA["A+"]} · A ${g.gradesSA.A} · B ${g.gradesSA.B} · C ${g.gradesSA.C}</div>
      <div class="detail-box"><strong>Goals by Grade</strong>A+ ${g.gradesGA["A+"]} · A ${g.gradesGA.A} · B ${g.gradesGA.B} · C ${g.gradesGA.C}</div>
      <div class="detail-box"><strong>Rebounds G/R/B</strong>${g.rebound.green} / ${g.rebound.red} / ${g.rebound.black}</div>
      <div class="detail-box"><strong>Playmaking G/R/B</strong>${g.playmaking.green} / ${g.playmaking.red} / ${g.playmaking.black}</div>
    </div>
    ${g.note?`<div class="note"><strong>Note:</strong> ${g.note}</div>`:""}
    <div class="small" style="margin-top:10px">${g.b2b?'<span class="tag">Back-to-back</span> ':""}${g.started?'<span class="tag">Started</span>':""}</div>`;
  }

  function windows(games,n){
    const out=[];
    for(let i=0;i<games.length;i+=n){
      const chunk=games.slice(i,i+n);
      if(chunk.length<n) continue;
      const a=aggregate(chunk);
      out.push({start:i+1,end:i+n,games:chunk,a});
    }
    return out;
  }

  function renderIncremental(games){
    if(!games.length) return empty(`No ${state.season} games have been logged for ${state.goalie} yet.`);
    const wins=windows(games,state.windowSize);
    app.innerHTML=`
      <div class="page-head">
        <div><div class="kicker">${state.season}</div><h2>Incremental Stats</h2><p>Non-overlapping performance windows modeled after the Yegorov-style layout.</p></div>
        <div class="toolbar"><button class="btn ${state.windowSize===5?"active":""}" id="w5">5-Game Windows</button><button class="btn ${state.windowSize===10?"active":""}" id="w10">10-Game Windows</button></div>
      </div>
      ${wins.length?`
        <div class="grid-2">
          <section class="panel"><h3 class="section-title">GA & xGA-GA</h3><div class="chart-wrap"><canvas id="incGa"></canvas></div></section>
          <section class="panel"><h3 class="section-title">SV% & SV%-xSV%</h3><div class="chart-wrap"><canvas id="incSv"></canvas></div></section>
        </div>
        <section class="panel"><h3 class="section-title">Shot Grade Distribution</h3><div class="chart-wrap tall"><canvas id="incGrades"></canvas></div></section>
        <section class="panel" style="margin-top:16px"><h3 class="section-title">Window Breakdown</h3>${windowTable(wins)}</section>
      `:`<div class="empty-state">You need ${state.windowSize} completed games to create the first ${state.windowSize}-game window.</div>`}
    `;
    el("w5").onclick=()=>{state.windowSize=5;renderIncremental(games)};
    el("w10").onclick=()=>{state.windowSize=10;renderIncremental(games)};
    if(!wins.length) return;
    const c=colors();
    chart("incGa",{type:"bar",data:{labels:wins.map(w=>`${w.start}-${w.end}`),datasets:[
      {label:"GA",data:wins.map(w=>w.a.ga),backgroundColor:c.green},
      {label:"xGA-GA",data:wins.map(w=>w.a.gsax),backgroundColor:c.gold}
    ]},options:baseOptions("Goals")});
    chart("incSv",{type:"line",data:{labels:wins.map(w=>`${w.start}-${w.end}`),datasets:[
      {label:"SV%",data:wins.map(w=>w.a.svp),borderColor:c.green,backgroundColor:c.green,pointRadius:5},
      {label:"SV%-xSV%",data:wins.map(w=>w.a.svp-w.a.xsvp),borderColor:c.gold,backgroundColor:c.gold,pointRadius:5}
    ]},options:baseOptions("Rate")});
    chart("incGrades",{type:"bar",data:{labels:wins.map(w=>`${w.start}-${w.end}`),datasets:["A+","A","B","C"].map((k,i)=>({label:k,data:wins.map(w=>w.a.gradesSA[k])}))},options:{...baseOptions("Shots"),plugins:{legend:{position:"bottom"}}}});
  }

  function windowTable(wins){
    return `<div class="table-wrap"><table><thead><tr><th>Games</th><th>Start</th><th>End</th><th>GP</th><th>Record</th><th>SOG</th><th>Avg SOG</th><th>SV</th><th>SV%</th><th>xSV%</th><th>SV%-xSV%</th><th>A+ SA</th><th>A SA</th><th>B SA</th><th>C SA</th><th>GA</th><th>GAA</th><th>xGA</th><th>xGA-GA</th></tr></thead><tbody>${
      wins.map(w=>`<tr><td>${w.start}-${w.end}</td><td>${dateLabel(w.games[0].date)}</td><td>${dateLabel(w.games.at(-1).date)}</td><td>${w.a.gp}</td><td>${w.a.record}</td><td>${w.a.sog}</td><td>${fixed(w.a.sog/w.a.gp,1)}</td><td>${w.a.sv}</td><td>${pct(w.a.svp)}</td><td>${pct(w.a.xsvp)}</td><td>${signed(w.a.svp-w.a.xsvp,3)}</td><td>${w.a.gradesSA["A+"]}</td><td>${w.a.gradesSA.A}</td><td>${w.a.gradesSA.B}</td><td>${w.a.gradesSA.C}</td><td>${w.a.ga}</td><td>${fixed(w.a.gaa,2)}</td><td>${fixed(w.a.xGA,2)}</td><td>${signed(w.a.gsax,2)}</td></tr>`).join("")
    }</tbody></table></div>`;
  }

  function renderPeriods(){
    app.innerHTML=`<div class="page-head"><div><h2>Period Breakdown</h2><p>Reserved for later.</p></div></div>
      <div class="coming"><div class="kicker">Optional module</div><h3>Period tracking is off for now</h3><p>You are not currently entering period-by-period or PK data, so this page stays clean instead of showing incomplete metrics.</p><div class="callout">When you decide to track periods, this page can be activated without changing the rest of the site.</div></div>`;
  }

  function renderAbout(){
    app.innerHTML=`<div class="page-head"><div><h2>About</h2><p>A low-work goalie dashboard built around your existing workflow.</p></div></div>
      <div class="grid-2">
        <section class="panel"><h3 class="section-title">Data Sources</h3><p><strong>SIG GameDay</strong> supplies shot grades, xGA, rebound tracking, glove tracking, and puck handling.</p><p><strong>Official box scores</strong> supply date, opponent, result, final score, TOI, and start information.</p></section>
        <section class="panel"><h3 class="section-title">Current Scope</h3><p>Overview, Game Log, and 5/10-game Incremental Stats are live. Opponent offensive rank is supported when you begin using it later in the season.</p><p>PK and period data are intentionally excluded for now.</p></section>
      </div>
      <section class="panel"><h3 class="section-title">Update Workflow</h3><p>This hosted site is configured to read the Games tab directly from Google Sheets on page load. If the sheet is not publicly readable, the site falls back to the most recently embedded data.</p></section>`;
  }

  function empty(msg){
    app.innerHTML=`<div class="page-head"><div><h2>${state.route==="overview"?"Overview":"Goalie Analytics"}</h2></div></div><div class="empty-state">${msg}</div>`;
  }

  function render(){
    destroyCharts();
    state.route=location.hash.replace("#","")||"overview";
    updateHeader();
    const games=filteredGames();
    if(state.route==="overview") renderOverview(games);
    else if(state.route==="games") renderGames(games);
    else if(state.route==="incremental") renderIncremental(games);
    else if(state.route==="periods") renderPeriods();
    else if(state.route==="about") renderAbout();
    else { location.hash="#overview"; return; }
    updateHeader();
    app.focus({preventScroll:true});
  }

  window.addEventListener("hashchange",render);
  setSelectors();
  render();
}

loadLiveGoalieData().then(DATA=>{
  const status=document.getElementById("liveStatus");
  if(status){status.textContent=DATA.live?"Live Sheet":"Embedded backup";status.classList.add(DATA.live?"ok":"fallback");}
  startGoalieApp(DATA);
});
</script>
</body>
</html>
